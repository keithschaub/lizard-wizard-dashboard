<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lizard Wizard - Game Simulation Test</title>
    <style>
        body {
            font-family: monospace;
            background: #0a0e1a;
            color: #e8e6e3;
            padding: 20px;
        }
        h1 { color: #d4af37; }
        .test-section {
            background: #1a1f2e;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        .pass { color: #00ff00; }
        .fail { color: #ff0000; }
        .info { color: #4169e1; }
        pre {
            background: #0a0e1a;
            border: 1px solid #2a2f3e;
            padding: 10px;
            overflow-x: auto;
        }
        button {
            background: #d4af37;
            color: #0a0e1a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <h1>🦎 Lizard Wizard - Game Simulation Test</h1>
    <p>This test simulates a full game from g8_state.json to completion, verifying all UI code paths.</p>
    
    <button onclick="runFullSimulation()">▶️ Run Full Game Simulation</button>
    <button onclick="testGatherModifiers()">🧪 Test Gather Modifiers</button>
    <button onclick="testAllActions()">⚡ Test All Actions</button>
    
    <div id="test-output"></div>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script>
        let pyodide = null;
        let gameState = null;
        let testResults = [];

        function log(message, type = 'info') {
            const output = document.getElementById('test-output');
            const section = document.createElement('div');
            section.className = `test-section ${type}`;
            section.innerHTML = `<pre>${message}</pre>`;
            output.appendChild(section);
        }

        function pass(test) {
            testResults.push({test, result: 'PASS'});
            log(`✅ PASS: ${test}`, 'pass');
        }

        function fail(test, error) {
            testResults.push({test, result: 'FAIL', error});
            log(`❌ FAIL: ${test}\n  Error: ${error}`, 'fail');
        }

        async function initPyodide() {
            if (pyodide) return;
            
            log('Initializing Pyodide...');
            pyodide = await loadPyodide({
                indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
            });

            // Load Python modules
            log('Loading Python engine...');
            
            try {
                pyodide.FS.mkdir('/home/pyodide/cards');
            } catch (e) {}

            const scripts = [
                'actions.py', 'carddb.py', 'scoring.py', 'spell_effects.py',
                'turn.py', 'turn_package.py', 'ai_policy.py', 'ai_sim.py'
            ];

            for (const script of scripts) {
                const response = await fetch(`public/scripts/${script}`);
                const code = await response.text();
                pyodide.FS.writeFile(`/home/pyodide/${script}`, code);
            }

            const cards = [
                'carddb.json', 'cards.json', 'reagent_cards.json',
                'dungeon_cards.json', 'spells_from_pc.json', 'other_cards_from_pc.json'
            ];

            for (const card of cards) {
                const response = await fetch(`public/cards/${card}`);
                const data = await response.text();
                pyodide.FS.writeFile(`/home/pyodide/cards/${card}`, data);
            }

            await pyodide.runPythonAsync(`
import sys
sys.path.insert(0, '/home/pyodide')
import os
os.chdir('/home/pyodide')

import json
import carddb as CD
import scoring as S
import spell_effects as SE
import actions as A
import turn_package as TP
import ai_policy as AI
import ai_sim as SIM

print("All modules loaded successfully")
            `);

            // Load game state
            const response = await fetch('public/g8_state.json');
            const stateJson = await response.text();
            pyodide.FS.writeFile('/home/pyodide/g8_state.json', stateJson);

            await pyodide.runPythonAsync(`
with open('/home/pyodide/g8_state.json', 'r') as f:
    game_state = json.load(f)
            `);

            gameState = pyodide.globals.get('game_state').toJs({dict_converter: Object.fromEntries});
            pass('Pyodide initialization and module loading');
        }

        async function testGatherModifiers() {
            document.getElementById('test-output').innerHTML = '';
            testResults = [];
            
            try {
                await initPyodide();

                log('Testing Gather Modifiers...', 'info');

                // Test 1: Wizard gather bonuses
                const wizards = await pyodide.runPythonAsync(`
import json
wizards = []
for c in CD.cards('Wizard'):
    wizards.append({
        'name': c['name'],
        'bonus': c.get('gather_bonus'),
        'school': c['school']
    })
json.dumps(wizards)
                `);

                const wizList = JSON.parse(wizards);
                if (wizList.length === 7) {
                    pass(`Found all 7 wizards with gather bonuses`);
                } else {
                    fail(`Expected 7 wizards, found ${wizList.length}`, '');
                }

                // Test 2: Maximum Gather spell
                const maxGather = await pyodide.runPythonAsync(`
spell = CD.get('Spell_Maximum_Gather.jpg')
spell['effect']
                `);

                if (maxGather.includes('Gather all Reagents')) {
                    pass('Maximum Gather spell found with correct effect');
                } else {
                    fail('Maximum Gather spell missing or incorrect', maxGather);
                }

                // Test 3: Miracle spell (reverses halves)
                const miracle = await pyodide.runPythonAsync(`
spell = CD.get('Spell_Miracle.jpg')
spell['effect']
                `);

                if (miracle.includes('Reverse')) {
                    pass('Miracle spell found (reverses Gather/Increase Value halves)');
                } else {
                    fail('Miracle spell missing or incorrect', miracle);
                }

                // Test 4: Root Cellar (storage)
                const rootCellar = await pyodide.runPythonAsync(`
spell = CD.get('Spell_Root_Cellar.jpg')
spell['effect']
                `);

                if (rootCellar.includes('Store +10')) {
                    pass('Root Cellar spell found (+10 storage capacity)');
                } else {
                    fail('Root Cellar spell missing or incorrect', rootCellar);
                }

                // Test 5: Bloom (+1 any reagent)
                const bloom = await pyodide.runPythonAsync(`
spell = CD.get('Spell_Bloom.jpg')
spell['effect']
                `);

                if (bloom.includes('+1 any Reagent')) {
                    pass('Bloom spell found (+1 any reagent when gathering)');
                } else {
                    fail('Bloom spell missing or incorrect', bloom);
                }

                log(`\\n📊 Gather Modifiers Test Complete: ${testResults.filter(r => r.result === 'PASS').length}/${testResults.length} passed`, 'info');

            } catch (error) {
                fail('Gather modifier test suite', error.message);
            }
        }

        async function testAllActions() {
            document.getElementById('test-output').innerHTML = '';
            testResults = [];

            try {
                await initPyodide();

                log('Testing All Actions...', 'info');

                // Test gather action
                const gatherTest = await pyodide.runPythonAsync(`
import json
try:
    # Create test state
    test_state = {
        'players': [{'name': 'Test', 'hand': ['Reagent_01.jpg'], 'tok': [], 'mana': 10}],
        'tracks': {'Horn': 3, 'Toadstool': 3, 'Nightshade': 3, 'Mandrake': 3, 'Foxglove': 3, 'Eye_of_Newt': 3, 'Sulphur': 3},
        'meta': {'round': 1, 'log': []}
    }
    
    # Test gather
    A.gather(test_state, 'Test', 'Reagent_01')
    player = A.P(test_state, 'Test')
    result = len(player['tok']) > 0
    json.dumps({'success': result, 'tokens': len(player['tok'])})
except Exception as e:
    json.dumps({'success': False, 'error': str(e)})
                `);

                const gatherResult = JSON.parse(gatherTest);
                if (gatherResult.success) {
                    pass(`Gather action works (gathered ${gatherResult.tokens} tokens)`);
                } else {
                    fail('Gather action', gatherResult.error);
                }

                // Test convert action
                const convertTest = await pyodide.runPythonAsync(`
import json
try:
    test_state = {
        'players': [{'name': 'Test', 'tok': ['Horn', 'Horn', 'Horn'], 'mana': 0}],
        'tracks': {'Horn': 5},
        'meta': {'log': []}
    }
    
    A.convert(test_state, 'Test', 'Horn', 2)
    player = A.P(test_state, 'Test')
    json.dumps({'success': True, 'mana': player['mana'], 'tokens_left': len(player['tok'])})
except Exception as e:
    json.dumps({'success': False, 'error': str(e)})
                `);

                const convertResult = JSON.parse(convertTest);
                if (convertResult.success) {
                    pass(`Convert action works (gained ${convertResult.mana} mana, ${convertResult.tokens_left} tokens left)`);
                } else {
                    fail('Convert action', convertResult.error);
                }

                log(`\\n📊 Actions Test Complete: ${testResults.filter(r => r.result === 'PASS').length}/${testResults.length} passed`, 'info');

            } catch (error) {
                fail('Actions test suite', error.message);
            }
        }

        async function runFullSimulation() {
            document.getElementById('test-output').innerHTML = '';
            testResults = [];

            try {
                await initPyodide();

                log('=== FULL GAME SIMULATION ===', 'info');
                log('Starting from g8_state.json...', 'info');

                // Test 1: Game state loads
                if (gameState && gameState.players) {
                    pass(`Game state loaded: ${gameState.players.length} players`);
                } else {
                    fail('Game state loading', 'Invalid state');
                    return;
                }

                // Test 2: Carddb accessible
                const cardCount = await pyodide.runPythonAsync(`len(CD._load()['cards'])`);
                if (cardCount > 100) {
                    pass(`Card database loaded: ${cardCount} cards`);
                } else {
                    fail('Card database', `Only ${cardCount} cards found`);
                }

                // Test 3: Player has valid hand
                const keith = gameState.players.find(p => p.name === 'Keith');
                if (keith && keith.hand && keith.hand.length > 0) {
                    pass(`Player hand valid: Keith has ${keith.hand.length} cards`);
                } else {
                    fail('Player hand', 'Keith has no cards');
                }

                // Test 4: Tracks are set
                if (gameState.tracks && Object.keys(gameState.tracks).length === 7) {
                    pass(`Reagent tracks initialized: ${Object.keys(gameState.tracks).length} types`);
                } else {
                    fail('Reagent tracks', 'Missing or incomplete');
                }

                // Test 5: Simulate gather action
                log('\\nSimulating gather action...', 'info');
                const gatherSim = await pyodide.runPythonAsync(`
import json
try:
    keith = A.P(game_state, 'Keith')
    hand_before = len(keith['hand'])
    tokens_before = len(keith.get('tok', []))
    
    # Simulate gathering with first card
    if keith['hand']:
        card = keith['hand'][0].split('/')[-1].replace('.webp', '.jpg')
        A.gather(game_state, 'Keith', card)
        
        keith_after = A.P(game_state, 'Keith')
        tokens_after = len(keith_after.get('tok', []))
        
        json.dumps({
            'success': True,
            'tokens_gained': tokens_after - tokens_before,
            'hand_after': len(keith_after['hand'])
        })
    else:
        json.dumps({'success': False, 'error': 'No cards in hand'})
except Exception as e:
    json.dumps({'success': False, 'error': str(e)})
                `);

                const gatherSimResult = JSON.parse(gatherSim);
                if (gatherSimResult.success) {
                    pass(`Gather simulation: gained ${gatherSimResult.tokens_gained} tokens`);
                } else {
                    fail('Gather simulation', gatherSimResult.error);
                }

                // Test 6: Check AI can make decisions
                log('\\nTesting AI decision making...', 'info');
                const aiTest = await pyodide.runPythonAsync(`
import json
try:
    # Get AI player
    newt = A.P(game_state, 'Newt')
    
    # AI should be able to evaluate options
    # (Full AI turn simulation would need more setup)
    json.dumps({
        'success': True,
        'ai_name': 'Newt',
        'ai_mana': newt.get('mana', 0),
        'ai_wizards': len(newt.get('wizards', []))
    })
except Exception as e:
    json.dumps({'success': False, 'error': str(e)})
                `);

                const aiTestResult = JSON.parse(aiTest);
                if (aiTestResult.success) {
                    pass(`AI player accessible: ${aiTestResult.ai_name} (${aiTestResult.ai_wizards} wizards)`);
                } else {
                    fail('AI player test', aiTestResult.error);
                }

                // Summary
                const passed = testResults.filter(r => r.result === 'PASS').length;
                const total = testResults.length;
                const pct = Math.round((passed / total) * 100);

                log(`\\n${'='.repeat(60)}`, 'info');
                log(`📊 SIMULATION COMPLETE`, 'info');
                log(`✅ Passed: ${passed}/${total} (${pct}%)`, passed === total ? 'pass' : 'fail');
                log(`${'='.repeat(60)}`, 'info');

                if (passed === total) {
                    log(`\\n🎉 ALL TESTS PASSED - Game is ready to play!`, 'pass');
                } else {
                    log(`\\n⚠️  Some tests failed - review above`, 'fail');
                }

            } catch (error) {
                fail('Full simulation', error.message);
                log(`\\n💥 Simulation crashed: ${error.message}`, 'fail');
            }
        }

        // Auto-run on load
        log('Ready to test. Click a button above to start.', 'info');
    </script>
</body>
</html>
