name: Deploy to GitHub Pages

# Deploys only from the default branch (i.e. after a PR is merged). Requires Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [Jan18_2025]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - name: Write deploy version stamp
        run: |
          SHA="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo '/** Generated at deploy — do not edit on Pages builds. */'
            echo "export const BUILD = '${{ github.run_number }}';"
            echo "export const SHA = '${SHA}';"
            echo "export const BUILT_AT = '${DATE}';"
            echo 'export function versionLabel() {'
            echo '  return `v1.0.${BUILD} · ${SHA} · ${BUILT_AT}`;'
            echo '}'
          } > app/js/version.js
      - name: Assemble the static site
        run: tools/build_site.sh _site
      - name: Stamp Pages asset URLs
        run: |
          SHA="${GITHUB_SHA::7}"
          python3 tools/stamp_pages_assets.py _site "${{ github.run_number }}-${SHA}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
