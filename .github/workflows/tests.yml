name: Test Python Engine

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ Jan18_2025 ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Run engine core tests
      run: |
        cd public/scripts
        python test_engine_core.py
