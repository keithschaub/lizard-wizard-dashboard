name = "lw-bug-relay"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# Production configuration
[env.production]
name = "lw-bug-relay"
routes = [
  { pattern = "lw-bug-relay.keithschaub.workers.dev", custom_domain = true }
]
